<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>كلماتي — لعبة الكلمات العربية</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;margin:0;overflow:hidden;}

  /* ===== الخلفية الكونية مع تعتيم متدرج ===== */
  body{
    font-family:'Tajawal','Segoe UI',system-ui,-apple-system,sans-serif;
    background: 
      linear-gradient(180deg,
        rgba(11,15,24,.72) 0%,
        rgba(11,15,24,.82) 35%,
        rgba(11,15,24,.90) 60%,
        rgba(11,15,24,.96) 100%),
      url('bg.jpg') center/cover no-repeat fixed;
    background-color: #0b0f18;
    color:#eef3ff;display:flex;flex-direction:column;
    user-select:none;-webkit-user-select:none;direction:rtl;
    height:100dvh;
    transition: background-image .6s ease;
  }

  body[data-tier="افتتاحي"]{
    background-image:
      linear-gradient(180deg, rgba(11,15,24,.62) 0%, rgba(11,15,24,.78) 60%, rgba(11,15,24,.88) 100%),
      url('bg.jpg');
  }
  body[data-tier="صاعد"]{
    background-image:
      linear-gradient(180deg, rgba(11,15,24,.70) 0%, rgba(11,15,24,.82) 60%, rgba(11,15,24,.92) 100%),
      url('bg.jpg');
  }
  body[data-tier="متقدم"]{
    background-image:
      linear-gradient(180deg, rgba(11,15,24,.78) 0%, rgba(11,15,24,.86) 60%, rgba(11,15,24,.94) 100%),
      url('bg.jpg');
  }
  body[data-tier="خبير"]{
    background-image:
      linear-gradient(180deg, rgba(11,15,24,.86) 0%, rgba(11,15,24,.92) 60%, rgba(11,15,24,.97) 100%),
      url('bg.jpg');
  }
  body[data-tier="أسطوري"]{
    background-image:
      linear-gradient(180deg, rgba(11,15,24,.92) 0%, rgba(11,15,24,.96) 60%, rgba(11,15,24,.99) 100%),
      url('bg.jpg');
  }

  @media (max-width: 600px){
    body, body[data-tier="افتتاحي"], body[data-tier="صاعد"],
    body[data-tier="متقدم"], body[data-tier="خبير"], body[data-tier="أسطوري"]{
      background-attachment: scroll, scroll;
    }
  }

  .hud{display:flex;align-items:center;gap:10px;padding:10px 14px 6px;}
  .icon-btn{
    width:40px;height:40px;border-radius:13px;flex:none;
    background:rgba(11,15,24,.55);border:1px solid rgba(255,255,255,.12);
    color:#eef3ff;font-size:18px;display:flex;align-items:center;justify-content:center;
    cursor:pointer;transition:.15s;backdrop-filter:blur(6px);
  }
  .icon-btn:active{transform:scale(.92);background:rgba(255,255,255,.15);}
  .hud-center{flex:1;text-align:center;min-width:0;}
  .lvl{font-size:12px;color:#93a4c4;letter-spacing:.4px;}
  .lvl b{color:#f0c060;font-size:16px;}
  .lvl #tierName{font-size:11px;font-weight:700;transition:color .3s;}
  .progress{height:6px;border-radius:99px;background:rgba(0,0,0,.5);margin-top:6px;overflow:hidden;border:1px solid rgba(255,255,255,.1);}
  .progress-fill{height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,#f0c060,#ffd98a);transition:width .35s ease,background .35s;}
  .coins{
    display:flex;align-items:center;gap:5px;flex:none;
    background:rgba(240,192,96,.15);border:1px solid rgba(240,192,96,.35);
    padding:7px 12px;border-radius:99px;color:#f0c060;font-weight:700;font-size:14px;
    backdrop-filter:blur(6px);
  }

  .board{flex:1;display:flex;align-items:center;justify-content:center;padding:4px 10px;min-height:0;}
  .grid{display:grid;gap:4px;}

  .cell{
    border-radius:9px;
    background:rgba(11,15,24,.55);
    border:1px solid rgba(255,255,255,.14);
    backdrop-filter: blur(2px);
    display:flex;align-items:center;justify-content:center;
    color:#f0c060;font-weight:700;line-height:1;
    transition:background .25s,transform .2s,border-color .25s;
  }
  .cell.empty{background:transparent;border-color:transparent;backdrop-filter:none;}
  .cell.revealed{
    background:linear-gradient(180deg,rgba(44,61,92,.92),rgba(34,48,74,.92));
    border-color:rgba(240,192,96,.42);
    animation:pop .32s cubic-bezier(.34,1.56,.64,1);
    box-shadow:0 2px 0 rgba(0,0,0,.4), 0 0 12px rgba(240,192,96,.15);
  }
  @keyframes pop{0%{transform:scale(.5)}60%{transform:scale(1.14)}100%{transform:scale(1)}}

  .word-slots{
    display:flex;flex-wrap:wrap;gap:5px;justify-content:center;
    padding:2px 12px 4px;min-height:24px;max-height:70px;
    overflow-y:auto;margin:0 auto;max-width:94vw;
  }
  .word-slot{
    padding:2px 8px;border-radius:7px;
    background:rgba(11,15,24,.55);
    border:1px solid rgba(255,255,255,.12);
    color:rgba(255,255,255,.32);
    font-size:11px;font-weight:600;letter-spacing:1.5px;
    transition:all .35s cubic-bezier(.34,1.56,.64,1);
    white-space:nowrap;backdrop-filter:blur(4px);
  }
  .word-slot.solved{
    background:rgba(77,208,177,.22);
    border-color:rgba(77,208,177,.6);
    color:#4dd0b1;font-weight:800;letter-spacing:1px;
    box-shadow:0 0 12px rgba(77,208,177,.4);
    animation:pop .4s cubic-bezier(.34,1.56,.64,1);
  }

  .wordline{
    height:44px;margin:0 auto;min-width:110px;max-width:80%;
    display:flex;align-items:center;justify-content:center;
    font-size:24px;font-weight:700;color:#fff;letter-spacing:2px;
    border-radius:14px;transition:.2s;padding:0 18px;cursor:pointer;
    text-shadow:0 2px 8px rgba(0,0,0,.8);
  }
  .wordline.active{
    background:rgba(11,15,24,.65);
    border:1px solid rgba(240,192,96,.4);
    color:#ffd98a;
    box-shadow:0 0 24px rgba(240,192,96,.2);
    backdrop-filter:blur(8px);
  }
  @keyframes shake{0%,100%{transform:translateX(0);}25%{transform:translateX(-6px);}75%{transform:translateX(6px);}}
  .wordline.invalid{
    animation:shake 0.25s;
    background:rgba(255,60,60,.2) !important;
    border:1px solid rgba(255,100,100,.55) !important;
    color:#ff9999 !important;
  }

  .wheel-wrap{display:flex;justify-content:center;padding-bottom:2px;}
  .wheel{position:relative;width:100%;max-width:340px;height:200px;touch-action:none;}

  .tile{
    position:absolute;border-radius:50%;
    border:1.5px solid rgba(240,192,96,.5);
    background:linear-gradient(180deg,rgba(43,58,85,.95),rgba(28,39,64,.95));
    color:#f0c060;font-weight:700;font-family:inherit;
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;padding:0;
    box-shadow:0 4px 0 rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.1), 0 0 12px rgba(240,192,96,.12);
    transition:transform .12s,background .18s,opacity .18s,box-shadow .12s;
    will-change:transform;
  }
  .tile:active:not(.used){filter:brightness(1.2);}
  .tile.used{
    opacity:.3;box-shadow:none;
    transform:translate(-50%,-50%) translate(var(--x),var(--y)) scale(.86)!important;
  }
  .shuffle-btn{
    position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
    width:46px;height:46px;border-radius:50%;
    background:rgba(11,15,24,.7);
    border:1px solid rgba(255,255,255,.15);
    color:#8fa3c4;font-size:22px;cursor:pointer;display:flex;
    align-items:center;justify-content:center;transition:.15s;
    backdrop-filter:blur(6px);
  }
  .shuffle-btn:active{transform:translate(-50%,-50%) scale(.88) rotate(120deg);}

  .actions{display:flex;gap:8px;justify-content:center;padding:8px 12px 14px;}
  .act{
    flex:1;max-width:150px;padding:11px 6px;border-radius:14px;
    background:rgba(11,15,24,.6);
    border:1px solid rgba(255,255,255,.15);
    color:#dbe6ff;font-family:inherit;font-size:13px;font-weight:600;
    cursor:pointer;transition:.15s;backdrop-filter:blur(6px);
  }
  .act:active{transform:scale(.96);background:rgba(255,255,255,.14);}
  .act .cost{color:#f0c060;font-size:11px;display:block;margin-top:2px;}

  #toast{
    position:fixed;top:72px;left:50%;transform:translateX(-50%) translateY(-16px);
    background:rgba(240,192,96,.25);
    border:1px solid rgba(240,192,96,.6);
    color:#ffe9b8;padding:9px 20px;border-radius:99px;font-size:14px;font-weight:600;
    opacity:0;pointer-events:none;transition:.3s;z-index:50;backdrop-filter:blur(10px);
    max-width:90vw;text-align:center;box-shadow:0 4px 24px rgba(0,0,0,.5);
  }
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  .overlay{
    position:fixed;inset:0;background:rgba(6,9,16,.85);backdrop-filter:blur(8px);
    display:flex;align-items:center;justify-content:center;padding:20px;
    opacity:0;pointer-events:none;transition:.25s;z-index:60;
  }
  .overlay.show{opacity:1;pointer-events:auto;}
  .modal{
    background:linear-gradient(180deg,#1d2740,#141c2e);
    border:1px solid rgba(240,192,96,.3);border-radius:24px;
    padding:24px 18px;text-align:center;max-width:360px;width:100%;
    transform:scale(.9);transition:.3s cubic-bezier(.34,1.56,.64,1);
    box-shadow:0 20px 60px rgba(0,0,0,.7), 0 0 40px rgba(240,192,96,.1);
    max-height:88vh;overflow-y:auto;
  }
  .overlay.show .modal{transform:scale(1);}
  .modal h2{margin:0 0 8px;font-size:22px;color:#f0c060;}
  .modal p{margin:0 0 16px;color:#93a4c4;font-size:14px;line-height:1.7;}
  .modal .big{font-size:44px;margin-bottom:8px;}
  .stars-row{font-size:32px;letter-spacing:4px;margin:8px 0 14px;}
  .btn-primary{
    width:100%;padding:15px;border-radius:14px;border:none;
    background:linear-gradient(180deg,#f0c060,#d9a333);
    color:#1a1206;font-family:inherit;font-size:16px;font-weight:800;
    cursor:pointer;transition:.15s;box-shadow:0 4px 0 rgba(150,100,20,.5);
  }
  .btn-primary:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(150,100,20,.5);}
  .btn-ghost{
    width:100%;padding:13px;margin-top:10px;border-radius:14px;
    background:transparent;border:1px solid rgba(255,255,255,.15);
    color:#93a4c4;font-family:inherit;font-size:14px;font-weight:600;cursor:pointer;
  }

  .map-container{
    position:relative;padding:24px 12px;
    background:linear-gradient(180deg,rgba(20,28,46,.75),rgba(13,19,31,.6));
    border-radius:18px;border:1px solid rgba(255,255,255,.08);
    margin-bottom:12px;overflow:hidden;
    max-height:60vh;overflow-y:auto;
  }
  .map-svg{position:absolute;top:0;left:0;pointer-events:none;z-index:0;}
  .map-nodes{position:relative;z-index:1;display:flex;flex-direction:column;gap:34px;padding:8px 0;}
  .map-node{
    position:relative;width:64px;height:64px;border-radius:50%;
    border:3px solid;cursor:pointer;font-family:inherit;font-weight:800;
    padding:0;display:flex;align-items:center;justify-content:center;
    transition:transform .18s cubic-bezier(.34,1.56,.64,1),box-shadow .2s;
  }
  .map-node:nth-child(odd){align-self:flex-start;margin-right:6%;}
  .map-node:nth-child(even){align-self:flex-end;margin-left:6%;}
  .map-node.completed{
    background:linear-gradient(180deg,#2c8f78,#1f6e5c);
    border-color:rgba(77,208,177,.6);color:#fff;
    box-shadow:0 4px 0 rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.2);
  }
  .map-node.current{
    background:linear-gradient(180deg,#f0c060,#d9a333);
    border-color:#ffd98a;color:#1a1206;transform:scale(1.12);
    animation:pulseNode 1.8s ease-in-out infinite;z-index:2;
  }
  @keyframes pulseNode{
    0%,100%{box-shadow:0 0 22px rgba(240,192,96,.6),0 4px 0 rgba(120,80,10,.6);}
    50%{box-shadow:0 0 42px rgba(240,192,96,1),0 4px 0 rgba(120,80,10,.6);}
  }
  .map-node.unlocked{
    background:linear-gradient(180deg,#2c3d5c,#22304a);
    border-color:rgba(240,192,96,.5);color:#f0c060;
    box-shadow:0 4px 0 rgba(0,0,0,.4);
  }
  .map-node.locked{
    background:rgba(255,255,255,.05);border-color:rgba(255,255,255,.12);
    color:rgba(255,255,255,.3);cursor:not-allowed;box-shadow:none;
  }
  .map-node:active:not(.locked){transform:scale(.93);}
  .node-num{font-size:18px;line-height:1;}
  .node-stars{
    position:absolute;bottom:-18px;left:50%;transform:translateX(-50%);
    font-size:10px;letter-spacing:-2px;white-space:nowrap;
    filter:drop-shadow(0 1px 2px rgba(0,0,0,.7));
  }
  .node-lock{
    position:absolute;top:-4px;left:-4px;font-size:12px;
    width:22px;height:22px;background:#0b0f18;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    border:1px solid rgba(255,255,255,.15);
  }
  .tier-badge{
    display:inline-block;padding:2px 10px;border-radius:99px;
    font-size:10px;font-weight:700;border:1px solid currentColor;
  }
  #confetti{position:fixed;inset:0;pointer-events:none;z-index:55;}
</style>
</head>
<body data-tier="افتتاحي">

<div class="hud">
  <button class="icon-btn" id="menuBtn">☰</button>
  <div class="hud-center">
    <div class="lvl">المستوى <b id="lvlNum">1</b> · <span id="tierName">🌱 افتتاحي</span></div>
    <div class="progress"><div class="progress-fill" id="progFill"></div></div>
  </div>
  <div class="coins"><span>◉</span><span id="coinNum">150</span></div>
</div>

<div class="board"><div class="grid" id="grid"></div></div>
<div class="word-slots" id="wordSlots"></div>
<div class="wordline" id="wordline"></div>
<div class="wheel-wrap"><div class="wheel" id="wheel"></div></div>

<div class="actions">
  <button class="act" id="hintLetterBtn">💡 حرف <span class="cost">−20 ◉</span></button>
  <button class="act" id="hintWordBtn">🔍 كلمة <span class="cost">−50 ◉</span></button>
  <button class="act" id="shuffleAct">🔀 خلط</button>
</div>

<div id="toast"></div>
<canvas id="confetti"></canvas>
<div class="overlay" id="overlay"><div class="modal" id="modal"></div></div>

<script>
/* =========================================================
   1) BASE_LEVELS — 65 مستوى أساسي
   ========================================================= */
const BASE_LEVELS = [
  { letters:['ع','ل','م'], words:['علم','عمل','لمع'] },
  { letters:['س','ل','م'], words:['سلم','لمس','ملس'] },
  { letters:['ق','ل','م'], words:['قلم','قمل','لقم'] },
  { letters:['س','ب','ح'], words:['سبح','سحب','حبس'] },
  { letters:['ر','ق','ص'], words:['رقص','قصر','صقر'] },
  { letters:['ر','م','ح'], words:['رمح','حرم','مرح'] },
  { letters:['ب','ن','ي'], words:['بني','نبي','بين'] },
  { letters:['ف','ل','س'], words:['فلس','سلف','سفل'] },
  { letters:['ك','ب','ر'], words:['كبر','ركب','برك'] },
  { letters:['ص','ب','ر'], words:['صبر','بصر','برص'] },
  { letters:['ع','ر','ض'], words:['عرض','ضرع','رضع'] },
  { letters:['ص','ح','ب'], words:['صحب','حصب','صبح'] },
  { letters:['ف','ت','ح'], words:['فتح','تحف','حتف'] },
  { letters:['ر','ك','ع'], words:['ركع','كرع','عرك'] },
  { letters:['ع','ي','ن'], words:['عين','ينع','نعي'] },
  { letters:['ب','ح','ر'], words:['بحر','حبر','حرب','رحب'], bonus:['برح','ربح'] },
  { letters:['ح','ل','م'], words:['حلم','حمل','لمح','محل'], bonus:['ملح','لحم'] },
  { letters:['ب','ق','ر'], words:['بقر','قبر','رقب','قرب'] },
  { letters:['ق','ل','ب'], words:['قلب','قبل','بقل','لبق'] },
  { letters:['ط','ل','ب'], words:['طلب','بطل','طبل','بلط'] },
  { letters:['ف','ت','ن'], words:['فتن','نفت','نتف'] },
  { letters:['ف','ر','ح'], words:['فرح','حرف','حفر'] },
  { letters:['ف','ر','ق'], words:['فرق','رفق','قرف','قفر'] },
  { letters:['س','م','ح'], words:['مسح','سمح','حسم'] },
  { letters:['ر','س','م'], words:['رسم','سمر','مرس','رمس'] },
  { letters:['س','ح','ر'], words:['سحر','حرس','حسر','سرح'] },
  { letters:['ك','ر','م'], words:['كرم','ركم','مكر'] },
  { letters:['ج','م','ر'], words:['جمر','مرج','رجم','جرم'] },
  { letters:['ص','ر','ف'], words:['صرف','رصف','فرص','صفر'] },
  { letters:['ح','س','ن'], words:['حسن','نحس','سنح'] },
  { letters:['ع','ر','ب'], words:['عرب','عبر','رعب','ربع','برع'] },
  { letters:['ر','ف','ع'], words:['رفع','فرع','عرف','عفر'] },
  { letters:['ع','م','د'], words:['عمد','عدم','دمع','معد'] },
  { letters:['غ','ف','ر'], words:['غفر','فرغ','غرف','رغف'] },
  { letters:['ع','ر','ق'], words:['عرق','قرع','رقع','عقر'] },
  { letters:['ج','م','د'], words:['جمد','دمج','مجد'] },
  { letters:['ه','ر','ب'], words:['هرب','بهر','رهب'] },
  { letters:['ه','د','م'], words:['هدم','مهد','دهم'] },
  { letters:['ل','ع','ب'], words:['لعب','بلع','علب'] },
  { letters:['س','ق','ط'], words:['سقط','طقس','قسط'] },
  { letters:['ك','ت','ا','ب'], words:['كتاب','كتب','كبت','بات','تاب'] },
  { letters:['س','ل','ا','م'], words:['سلام','سلم','لمس','ملس','مال','لام'] },
  { letters:['ع','ل','ا','م'], words:['عالم','علم','لامع','عمل','لمع','مال','لام'] },
  { letters:['ك','ل','م','ة'], words:['كلمة','كلم','ملك','كمل'] },
  { letters:['م','د','ر','س'], words:['مدرس','درس','سرد','سمر','رمد','دمر','مرد'] },
  { letters:['ح','ص','ا','ن'], words:['حصن','صحن','نصح','حصان'] },
  { letters:['ع','ش','ر','ص'], words:['شعر','عرش','شرع','عصر','رعش'] },
  { letters:['س','ر','ق','ص'], words:['سرق','قسر','قرص','رقص','قصر','صقر'] },
  { letters:['ف','ا','ت','ح'], words:['فاتح','فتح','تحف','حتف'] },
  { letters:['ح','ا','ر','س'], words:['حارس','حرس','سحر','حسر','سرح','حار'] },
  { letters:['م','ا','ل','ك'], words:['مالك','ملك','مال','كمل','كلم','لكم','كامل'] },
  { letters:['ع','ا','د','ل'], words:['عادل','عدل','دلع'] },
  { letters:['ب','ع','د'], words:['بعد','عبد','دعب'] },
  { letters:['و','ع','د'], words:['وعد','عدو','دعو'] },
  { letters:['ك','س','ب'], words:['كسب','سكب','كبس'] },
  { letters:['س','ل','ا','م','ة'], words:['سلامة','سلام','سلم','سالم','لمس','مال','لام'] },
  { letters:['م','د','ر','س','ة'], words:['مدرسة','مدرس','مدر','درس','سرد','سمر'] },
  { letters:['م','ك','ت','ب','ة'], words:['مكتبة','مكتب','كتب','كبت','بات','تاب'] },
  { letters:['ك','ت','ا','ب','ة'], words:['كتابة','كتاب','كاتب','كتب','بات','تاب'] },
  { letters:['ع','ا','م','ل','ة'], words:['عاملة','عامل','عمل','علم','لمع','مال','لام'] },
  { letters:['س','ا','ح','ر','ة'], words:['ساحرة','ساحر','سحر','حرس','حسر','سرح','ساحة','حارة'] },
  { letters:['م','ع','ل','م','ة'], words:['معلمة','معلم','معمل','عمل','علم','لمع'] },
  { letters:['م','ف','ت','ا','ح'], words:['مفتاح','فتح','فاتح','تحف','حتف'] },
  { letters:['م','س','ج','د'], words:['مسجد','سجد','مجد','جمد'] },
];

/* =========================================================
   2) MEANINGS — معاني الكلمات
   ========================================================= */
const MEANINGS = {
  'علم':'معرفة وإدراك','عمل':'جهد ومهمة','لمع':'أضاء وأشرق','بحر':'مسطح مائي كبير',

/* =========================================================
   7) مولّد Crossword
   ========================================================= */
function canPlace(word, r, c, d, grid){
  let hasIntersection = false;
  for(let k=0; k<word.length; k++){
    const rr = r + (d==='v'?k:0);
    const cc = c + (d==='h'?k:0);
    const key = `${rr},${cc}`;
    if(grid[key]){
      if(grid[key] !== word[k]) return false;
      hasIntersection = true;
    } else {
      const n1 = d==='h' ? `${rr-1},${cc}` : `${rr},${cc-1}`;
      const n2 = d==='h' ? `${rr+1},${cc}` : `${rr},${cc+1}`;
      if(grid[n1] || grid[n2]) return false;
    }
  }
  if(!hasIntersection) return false;
  const before = d==='v' ? `${r-1},${c}` : `${r},${c-1}`;
  const after  = d==='v' ? `${r+word.length},${c}` : `${r},${c+word.length}`;
  if(grid[before] || grid[after]) return false;
  return true;
}

function findPlacement(word, placed, grid){
  const candidates = [];
  for(const p of placed){
    for(let i=0; i<word.length; i++){
      for(let j=0; j<p.w.length; j++){
        if(word[i] !== p.w[j]) continue;
        const newD = p.d === 'h' ? 'v' : 'h';
        let newR, newC;
        if(newD === 'v'){ newR = p.r - i; newC = p.c + j; }
        else            { newR = p.r + j; newC = p.c - i; }
        if(canPlace(word, newR, newC, newD, grid)){
          const midI = Math.abs(i - word.length/2);
          const midJ = Math.abs(j - p.w.length/2);
          candidates.push({r:newR, c:newC, d:newD, score:-(midI+midJ)});
        }
      }
    }
  }
  if(!candidates.length) return null;
  candidates.sort((a,b)=> b.score - a.score);
  return candidates[0];
}

function generateLayout(words){
  if(!words.length) return [];
  const sorted = [...words].sort((a,b)=> b.length - a.length);
  const placed = [];
  const grid = {};
  const first = sorted[0];
  for(let k=0;k<first.length;k++) grid[`0,${k}`] = first[k];
  placed.push({w:first, r:0, c:0, d:'h'});

  for(let wi=1; wi<sorted.length; wi++){
    const word = sorted[wi];
    const p = findPlacement(word, placed, grid);
    if(p){
      for(let k=0;k<word.length;k++){
        const rr = p.r + (p.d==='v'?k:0);
        const cc = p.c + (p.d==='h'?k:0);
        grid[`${rr},${cc}`] = word[k];
      }
      placed.push({w:word, r:p.r, c:p.c, d:p.d});
    }
  }
  let minR=0, minC=0;
  placed.forEach(p=>{ minR=Math.min(minR,p.r); minC=Math.min(minC,p.c); });
  return placed.map(p=>({...p, r:p.r-minR, c:p.c-minC}));
}

/* =========================================================
   8) الكلمات القابلة للتكوين
   ========================================================= */
function canFormWord(word, counts) {
  const used = {};
  for (const ch of word) {
    used[ch] = (used[ch] || 0) + 1;
    if (used[ch] > (counts[ch] || 0)) return false;
  }
  return true;
}

function findFormableWords(letters) {
  const counts = {};
  for (const l of letters) counts[l] = (counts[l] || 0) + 1;
  const found = [];
  for (let len = 2; len <= letters.length; len++) {
    const dict = ARABIC_DICTIONARY[len];
    if (!dict) continue;
    for (const w of dict) {
      if (canFormWord(w, counts)) found.push(w);
    }
  }
  return found;
}

/* =========================================================
   9) initLevels — مستويات بترتيب صعوبة تصاعدي
   ========================================================= */
let LEVELS = [];
let TOTAL_LEVELS = 0;

function initLevels() {
  if (TOTAL_LEVELS > 0) return;

  const candidates = [];
  const seenSigs = new Set();
  const allPools = [
    ...BASE_LEVELS.map(l => l.letters),
    ...LETTER_POOLS
  ];

  for (const rawLetters of allPools) {
    const letters = rawLetters.filter(l => l && l.length === 1);
    if (letters.length < 3 || letters.length > 8) continue;
    const sig = [...letters].sort().join('|');
    if (seenSigs.has(sig)) continue;

    const allWords = findFormableWords(letters);
    if (allWords.length < 3) continue;
    seenSigs.add(sig);
    allWords.sort((a, b) => b.length - a.length || a.localeCompare(b, 'ar'));
    candidates.push({ letters, allWords });
  }

  candidates.sort((a, b) => a.allWords.length - b.allWords.length);

  LEVELS = [];
  const used = new Set();
  const MAX_BUILD = 240;

  for (let levelNum = 1; levelNum <= MAX_BUILD; levelNum++) {
    const target = getTargetForLevel(levelNum);
    let pick = null;

    for (const cand of candidates) {
      if (used.has(cand)) continue;
      if (cand.allWords.length >= target) { pick = cand; break; }
    }

    if (!pick) {
      const sortedByPower = [...candidates].sort((a,b) => b.allWords.length - a.allWords.length);
      pick = sortedByPower[(levelNum - 1) % sortedByPower.length];
    }
    used.add(pick);

    let built = null;
    for (let tryN = Math.min(target, pick.allWords.length); tryN >= 3; tryN--) {
      const required = pick.allWords.slice(0, tryN);
      const layout = generateLayout(required);
      const placedSet = new Set(layout.map(p => p.w));
      if (placedSet.size >= 3) {
        const finalWords = required.filter(w => placedSet.has(w));
        const leftover = required.filter(w => !placedSet.has(w));
        built = {
          letters: pick.letters,
          words: finalWords,
          bonus: [...pick.allWords.slice(tryN), ...leftover],
          layout: layout
        };
        break;
      }
    }
    if (built) LEVELS.push(built);
  }

  TOTAL_LEVELS = LEVELS.length;

  console.log(`📚 ${TOTAL_LEVELS} مستوى بترتيب صعوبة تصاعدي`);
}

/* =========================================================
   10) buildInfiniteLevel
   ========================================================= */
function buildInfiniteLevel(levelNum) {
  const strongPools = [];
  const seen = new Set();

  for (const pool of LETTER_POOLS) {
    const letters = pool.filter(l => l && l.length === 1);
    if (letters.length < 3) continue;
    const sig = [...letters].sort().join('|');
    if (seen.has(sig)) continue;
    seen.add(sig);

    const allWords = findFormableWords(letters);
    if (allWords.length < 8) continue;

    allWords.sort((a, b) => b.length - a.length || a.localeCompare(b, 'ar'));
    strongPools.push({ letters, allWords });
  }

  if (!strongPools.length) return LEVELS[levelNum % LEVELS.length];

  const idx = (levelNum - TOTAL_LEVELS - 1) % strongPools.length;
  const pick = strongPools[idx];
  const target = 8;

  for (let tryN = target; tryN >= 3; tryN--) {
    const required = pick.allWords.slice(0, tryN);
    const layout = generateLayout(required);
    const placedSet = new Set(layout.map(p => p.w));

    if (placedSet.size >= 3) {
      return {
        letters: pick.letters,
        words: required.filter(w => placedSet.has(w)),
        bonus: pick.allWords.slice(tryN),
        layout
      };
    }
  }

  return LEVELS[levelNum % LEVELS.length];
}

/* =========================================================
   11) الحالة والعناصر
   ========================================================= */
const state = {
  currentLevel: 1, maxUnlocked: 1, coins: 150, sound: true, stars: {},
  level: null, letters: [], selected: [],
  solved: new Set(), foundBonus: new Set(), manualRevealed: new Set(),
  grid: {}, bounds: {rows:0, cols:0}, hintsUsed: 0,
};

const els = {
  grid: document.getElementById('grid'),
  wheel: document.getElementById('wheel'),
  wordline: document.getElementById('wordline'),
  wordSlots: document.getElementById('wordSlots'),
  lvlNum: document.getElementById('lvlNum'),
  tierName: document.getElementById('tierName'),
  coinNum: document.getElementById('coinNum'),
  progFill: document.getElementById('progFill'),
  toast: document.getElementById('toast'),
  overlay: document.getElementById('overlay'),
  modal: document.getElementById('modal'),
  confetti: document.getElementById('confetti'),
};

/* =========================================================
   12) أدوات
   ========================================================= */
let audioCtx = null;
function beep(freq=440, dur=0.08, type='sine', vol=0.05){
  if(!state.sound) return;
  try{
    audioCtx = audioCtx || new (window.AudioContext||window.webkitAudioContext)();
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.type = type; o.frequency.value = freq; g.gain.value = vol;
    o.connect(g); g.connect(audioCtx.destination);
    o.start();
    g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + dur);
    o.stop(audioCtx.currentTime + dur);
  }catch(e){}
}

function shuffleArr(a){
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}

let toastTimer = null;
function toast(msg, ms=1800){
  els.toast.textContent = msg;
  els.toast.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>els.toast.classList.remove('show'), ms);
}

function save(){
  try{
    localStorage.setItem('kalimati_save', JSON.stringify({
      currentLevel: state.currentLevel, maxUnlocked: state.maxUnlocked,
      coins: state.coins, sound: state.sound, stars: state.stars,
    }));
  }catch(e){}
}

function loadSave(){
  try{
    const raw = localStorage.getItem('kalimati_save');
    if(!raw) return;
    const d = JSON.parse(raw);
    if(typeof d.coins === 'number') state.coins = d.coins;
    if(typeof d.maxUnlocked === 'number') state.maxUnlocked = Math.max(1, d.maxUnlocked);
    if(typeof d.currentLevel === 'number') state.currentLevel = Math.max(1, d.currentLevel);
    if(typeof d.sound === 'boolean') state.sound = d.sound;
    if(d.stars && typeof d.stars === 'object') state.stars = d.stars;
  }catch(e){}
}

/* =========================================================
   13) بناء الشبكة
   ========================================================= */
function computeGrid(layout){
  const grid = {};
  layout.forEach((p, wi)=>{
    for(let k=0;k<p.w.length;k++){
      const rr = p.r + (p.d==='v'?k:0);
      const cc = p.c + (p.d==='h'?k:0);
      const key = `${rr},${cc}`;
      if(!grid[key]) grid[key] = {r:rr, c:cc, key, char:p.w[k], words:[]};
      if(!grid[key].words.includes(wi)) grid[key].words.push(wi);
    }
  });
  let maxR=0, maxC=0;
  for(const k in grid){
    if(grid[k].r > maxR) maxR = grid[k].r;
    if(grid[k].c > maxC) maxC = grid[k].c;
  }
  state.grid = grid;
  state.bounds = {rows: maxR+1, cols: maxC+1};
}

function isRevealed(cell){
  if(state.manualRevealed.has(cell.key)) return true;
  return cell.words.some(wi => state.solved.has(wi));
}

/* =========================================================
   14) الرسم
   ========================================================= */
function renderGrid(){
  const {rows, cols} = state.bounds;
  const gap = 4;
  const availW = Math.min(window.innerWidth - 24, 420);
  const availH = window.innerHeight * 0.38;
  let size = Math.min(
    (availW - (cols-1)*gap) / cols,
    (availH - (rows-1)*gap) / rows,
    58
  );
  size = Math.max(size, 22);

  els.grid.innerHTML = '';
  els.grid.style.gridTemplateColumns = `repeat(${cols}, ${size}px)`;
  els.grid.style.gridTemplateRows    = `repeat(${rows}, ${size}px)`;
  els.grid.style.fontSize = Math.round(size*0.5) + 'px';

  for(let r=0;r<rows;r++){
    for(let c=0;c<cols;c++){
      const cell = state.grid[r+','+c];
      const div = document.createElement('div');
      div.className = 'cell';
      if(!cell){ div.classList.add('empty'); }
      else if(isRevealed(cell)){
        div.classList.add('revealed');
        div.textContent = cell.char;
      }
      els.grid.appendChild(div);
    }
  }
}

function renderWheel(){
  els.wheel.innerHTML = '';
  const n = state.letters.length;
  const radius = n <= 4 ? 70 : (n <= 5 ? 80 : 90);
  const size = n <= 4 ? 56 : 48;
  els.wheel.style.height = (radius*2 + size + 8) + 'px';

  state.letters.forEach((ch, i)=>{
    const angle = (i/n) * Math.PI*2 - Math.PI/2;
    const x = Math.cos(angle) * radius;
    const y = Math.sin(angle) * radius;
    const b = document.createElement('button');
    b.className = 'tile';
    b.textContent = ch;
    b.dataset.idx = i;
    b.style.width = size + 'px';
    b.style.height = size + 'px';
    b.style.fontSize = Math.round(size*0.46) + 'px';
    b.style.left = '50%'; b.style.top = '50%';
    b.style.setProperty('--x', x+'px');
    b.style.setProperty('--y', y+'px');
    b.style.transform = `translate(-50%,-50%) translate(${x}px,${y}px)`;
    if(state.selected.includes(i)) b.classList.add('used');
    els.wheel.appendChild(b);
  });

  const sh = document.createElement('button');
  sh.className = 'shuffle-btn';
  sh.textContent = '⟳';
  sh.addEventListener('pointerdown', e => e.stopPropagation());
  sh.addEventListener('click', doShuffle);
  els.wheel.appendChild(sh);
}

function updateTileStates(){
  els.wheel.querySelectorAll('.tile').forEach(t=>{
    const i = parseInt(t.dataset.idx, 10);
    if(state.selected.includes(i)) t.classList.add('used');
    else t.classList.remove('used');
  });
}

function renderSelection(){
  if(state.selected.length === 0){
    els.wordline.textContent = '';
    els.wordline.classList.remove('active');
    return;
  }
  els.wordline.classList.add('active');
  els.wordline.textContent = state.selected.map(i => state.letters[i]).join('');
}

function renderWordSlots(){
  if (!els.wordSlots) return;
  els.wordSlots.innerHTML = '';

  const sorted = state.level.words
    .map((w, i) => ({ w, i }))
    .sort((a, b) => a.w.length - b.w.length || a.i - b.i);

  sorted.forEach(({ w, i }) => {
    const slot = document.createElement('div');
    slot.className = 'word-slot';
    if (state.solved.has(i)) {
      slot.classList.add('solved');
      slot.textContent = w;
    } else {
      slot.textContent = '•'.repeat(w.length);
    }
    els.wordSlots.appendChild(slot);
  });
}

function renderHUD(){
  const tier = getTier(state.currentLevel);
  els.lvlNum.textContent = state.currentLevel;
  els.lvlNum.style.color = tier.color;
  if (els.tierName) {
    els.tierName.textContent = `${tier.emoji} ${tier.name}`;
    els.tierName.style.color = tier.color;
  }

  document.body.setAttribute('data-tier', tier.name);

  els.coinNum.textContent = state.coins;

  const total = state.level.words.length || 1;
  const done = state.solved.size;
  els.progFill.style.width = (done/total*100) + '%';
  els.progFill.style.background = `linear-gradient(90deg, ${tier.color}, ${tier.color}cc)`;

  renderWordSlots();
}

function renderAll(){
  renderGrid(); renderWheel(); renderSelection(); renderHUD();
}

/* =========================================================
   15) منطق اللعب
   ========================================================= */
function loadLevel(levelNum){
  initLevels();
  state.currentLevel = Math.max(1, levelNum);
  if(state.currentLevel > state.maxUnlocked) state.maxUnlocked = state.currentLevel;

  let raw;
  if (state.currentLevel <= TOTAL_LEVELS) {
    raw = LEVELS[state.currentLevel - 1];
  } else {
    raw = buildInfiniteLevel(state.currentLevel);
  }

  if (!raw) { toast('تعذّر توليد مستوى'); return; }

  state.level = {
    letters: raw.letters,
    words: raw.words,
    bonus: raw.bonus || [],
    layout: raw.layout
  };
  state.solved = new Set();
  state.foundBonus = new Set();
  state.manualRevealed = new Set();
  state.selected = [];
  state.hintsUsed = 0;
  state.letters = shuffleArr([...raw.letters]);
  computeGrid(raw.layout);
  renderAll();
  save();
}

function handlePointerDown(idx){
  if(isNaN(idx)) return;
  if(state.selected.includes(idx)){
    if(state.selected[state.selected.length-1] === idx){
      state.selected.pop();
      beep(380, 0.04, 'sine', 0.035);
      updateTileStates(); renderSelection();
    }
    return;
  }
  if(state.selected.length >= state.letters.length) return;
  state.selected.push(idx);
  beep(560, 0.04, 'sine', 0.04);
  updateTileStates(); renderSelection();
}

function checkWord(){
  const str = state.selected.map(i => state.letters[i]).join('');
  if(str.length < 2) return;

  for(let i=0;i<state.level.words.length;i++){
    if(state.solved.has(i)) continue;
    if(state.level.words[i] === str){ solveWord(i); return; }
  }

  const levelBonus = state.level.bonus || [];
  if(str.length >= 3 && levelBonus.includes(str) && !state.foundBonus.has(str)){
    state.foundBonus.add(str);
    state.coins += 10;
    beep(880, 0.09, 'triangle', 0.05);
    const meaning = MEANINGS[str] || 'كلمة عربية صحيحة';
    toast(`✨ ${str} — ${meaning}  +10 ◉`);
    state.selected = [];
    updateTileStates(); renderSelection(); renderHUD(); save();
    return;
  }

  if(str.length >= 3
     && !state.foundBonus.has(str)
     && ARABIC_DICTIONARY[str.length]
     && ARABIC_DICTIONARY[str.length].has(str)){
    state.foundBonus.add(str);
    state.coins += 5;
    beep(720, 0.07, 'triangle', 0.035);
    const meaning = MEANINGS[str] || 'كلمة عربية صحيحة';
    toast(`✓ ${str} — ${meaning}  +5 ◉`);
    state.selected = [];
    updateTileStates(); renderSelection(); renderHUD(); save();
    return;
  }

  if(state.selected.length === state.letters.length){
    els.wordline.classList.add('invalid');
    setTimeout(()=>els.wordline.classList.remove('invalid'), 280);
    setTimeout(()=>{
      if(state.selected.length === state.letters.length){
        state.selected = [];
        updateTileStates(); renderSelection();
      }
    }, 420);
  }
}

function solveWord(i){
  state.solved.add(i);
  state.selected = [];
  beep(660, 0.09, 'sine', 0.05);
  setTimeout(()=> beep(990, 0.13, 'sine', 0.045), 70);

  const word = state.level.words[i];
  if(MEANINGS[word]) toast('✓ ' + word + ' — ' + MEANINGS[word], 2000);

  renderGrid(); updateTileStates(); renderSelection(); renderHUD(); save();

  if(state.solved.size === state.level.words.length){
    setTimeout(levelComplete, 600);
  }
}

function doShuffle(){
  state.selected = [];
  state.letters = shuffleArr(state.letters);
  renderSelection(); renderWheel();
  beep(300, 0.06, 'sine', 0.04);
}

function useHintLetter(){
  if(state.coins < 20){ toast('تحتاج 20 ذهبة على الأقل'); return; }
  const candidates = [];
  state.level.layout.forEach((p, wi)=>{
    if(state.solved.has(wi)) return;
    for(let k=0;k<p.w.length;k++){
      const rr = p.r + (p.d==='v'?k:0);
      const cc = p.c + (p.d==='h'?k:0);
      const cell = state.grid[`${rr},${cc}`];
      if(cell && !isRevealed(cell)) candidates.push(cell);
    }
  });
  if(!candidates.length){ toast('لا يوجد ما يحتاج تلميحًا'); return; }
  const pick = candidates[Math.floor(Math.random()*candidates.length)];
  state.coins -= 20;
  state.hintsUsed++;
  state.manualRevealed.add(pick.key);
  renderGrid(); renderHUD(); save();
  beep(440, 0.1, 'triangle', 0.05);
  toast('تم كشف حرف  −20 ◉');
}

function useHintWord(){
  if(state.coins < 50){ toast('تحتاج 50 ذهبة على الأقل'); return; }
  const candidates = [];
  state.level.layout.forEach((p, wi)=>{
    if(state.solved.has(wi)) return;
    candidates.push({p, wi});
  });
  if(!candidates.length){ toast('لا يوجد ما يحتاج تلميحًا'); return; }
  const pick = candidates[Math.floor(Math.random()*candidates.length)];
  state.coins -= 50;
  state.hintsUsed++;
  for(let k=0;k<pick.p.w.length;k++){
    const rr = pick.p.r + (pick.p.d==='v'?k:0);
    const cc = pick.p.c + (pick.p.d==='h'?k:0);
    state.manualRevealed.add(`${rr},${cc}`);
  }
  state.solved.add(pick.wi);
  renderGrid(); renderHUD(); save();
  beep(660, 0.12, 'sine', 0.05);
  toast('تم كشف الكلمة: ' + pick.p.w + '  −50 ◉', 2000);
  if(state.solved.size === state.level.words.length){
    setTimeout(levelComplete, 700);
  }
}

/* =========================================================
   16) نهاية المستوى
   ========================================================= */
function levelComplete(){
  beep(523,0.14,'sine',0.06);
  setTimeout(()=>beep(659,0.14,'sine',0.06),130);
  setTimeout(()=>beep(784,0.28,'sine',0.06),270);

  const tier = getTier(state.currentLevel);
  state.coins += tier.reward;

  const starsEarned = state.hintsUsed === 0 ? 3 : (state.hintsUsed <= 2 ? 2 : 1);
  const prev = state.stars[state.currentLevel] || 0;
  if(starsEarned > prev) state.stars[state.currentLevel] = starsEarned;

  const nextLevel = state.currentLevel + 1;
  if(nextLevel > state.maxUnlocked) state.maxUnlocked = nextLevel;
  save();

  launchConfetti();

  const starsRow = '⭐'.repeat(starsEarned) + '☆'.repeat(3-starsEarned);
  const starMsg = starsEarned === 3 ? 'أداء مثالي — بلا تلميحات!'
    : starsEarned === 2 ? 'أداء رائع' : 'أكملت المستوى';

  const nextTier = getTier(nextLevel);
  const tierUpMsg = nextTier.name !== tier.name
    ? `<p style="color:${nextTier.color};font-weight:700;margin:0 0 12px">${nextTier.emoji} ترقيت إلى طبقة "${nextTier.name}"!</p>`
    : '';

  showModal(`
    <div class="big">${tier.emoji}</div>
    <h2>🏆 أحسنت!</h2>
    <div class="stars-row">${starsRow}</div>
    <p style="margin-bottom:8px">${starMsg}</p>
    <p style="margin-bottom:8px;font-size:12px;color:${tier.color}">
      <span class="tier-badge">${tier.name}</span> طبقة
    </p>
    ${tierUpMsg}
    <p style="margin-bottom:16px;font-size:13px">
      المستوى ${state.currentLevel} مكتمل<br>
      <b style="color:#f0c060">+${tier.reward} ◉</b> مكافأة إتمام
      ${state.foundBonus.size ? ` • <b style="color:#4dd0b1">+${state.foundBonus.size * 5} ◉</b> كلمات مكتشفة` : ''}
    </p>
    <button class="btn-primary" id="modalMain">المستوى ${nextLevel} ←</button>
    <button class="btn-ghost" id="modalGhost">🗺️ خريطة المستويات</button>
  `);

  document.getElementById('modalMain').onclick = ()=>{ hideModal(); loadLevel(nextLevel); };
  document.getElementById('modalGhost').onclick = ()=>{ hideModal(); showLevels(); };
}

/* =========================================================
   17) Confetti
   ========================================================= */
function launchConfetti(){
  const canvas = els.confetti;
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  const ctx = canvas.getContext('2d');
  const colors = ['#f0c060','#ff6b6b','#4dd0b1','#7fb3ff','#ffd98a','#ff9f43'];
  const particles = [];
  for(let i=0; i<160; i++){
    particles.push({
      x: canvas.width/2 + (Math.random()-0.5) * canvas.width * 0.6,
      y: -20 - Math.random()*200,
      vx: (Math.random()-0.5) * 6, vy: 2 + Math.random() * 4,
      size: 5 + Math.random() * 7,
      color: colors[Math.floor(Math.random()*colors.length)],
      rot: Math.random() * 360, rotSpeed: (Math.random()-0.5) * 12,
    });
  }
  const startTime = performance.now();
  function animate(now){
    const elapsed = now - startTime;
    ctx.clearRect(0,0,canvas.width,canvas.height);
    particles.forEach(p=>{
      p.x += p.vx; p.y += p.vy; p.vy += 0.15; p.rot += p.rotSpeed;
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot * Math.PI/180);
      ctx.fillStyle = p.color;
      ctx.fillRect(-p.size/2, -p.size/2, p.size, p.size * 0.6);
      ctx.restore();
    });
    if(elapsed < 3200) requestAnimationFrame(animate);
    else ctx.clearRect(0,0,canvas.width,canvas.height);
  }
  requestAnimationFrame(animate);
}

/* =========================================================
   18) النوافذ + الخريطة
   ========================================================= */
function showModal(html){ els.modal.innerHTML = html; els.overlay.classList.add('show'); }
function hideModal(){ els.overlay.classList.remove('show'); }

function showLevels(){
  const startLevel = Math.max(1, state.currentLevel - 10);
  const endLevel = Math.min(state.maxUnlocked + 8, state.currentLevel + 20);

  let html = `
    <h2>🗺️ خريطة المستويات</h2>
    <p style="margin-bottom:14px;font-size:13px">أكمل المستوى لتفتح الذي يليه</p>
    <div class="map-container" id="mapContainer">
      <svg class="map-svg" id="mapSvg"></svg>
      <div class="map-nodes" id="mapNodes"></div>
    </div>
    <button class="btn-ghost" id="modalGhost">إغلاق</button>
  `;
  showModal(html);

  const nodesEl = document.getElementById('mapNodes');

  for (let i = startLevel; i <= endLevel; i++) {
    let status;
    if (i === state.currentLevel)     status = 'current';
    else if (state.stars[i])          status = 'completed';
    else if (i <= state.maxUnlocked)  status = 'unlocked';
    else                              status = 'locked';

    const node = document.createElement('button');
    node.className = 'map-node ' + status;
    node.dataset.i = i;

    const stars = state.stars[i] || 0;
    node.innerHTML = `
      <span class="node-num">${i}</span>
      ${stars ? `<span class="node-stars">${'⭐'.repeat(stars)}</span>` : ''}
      ${status === 'locked' ? '<span class="node-lock">🔒</span>' : ''}
    `;

    node.onclick = () => {
      if (status === 'locked'){ toast('أكمل المستويات السابقة أولاً'); return; }
      hideModal(); loadLevel(i);
    };
    nodesEl.appendChild(node);
  }

  setTimeout(() => {
    drawMapConnections();
    const current = nodesEl.querySelector('.map-node.current');
    if (current) current.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }, 60);

  document.getElementById('modalGhost').onclick = hideModal;
}

function drawMapConnections(){
  const svg = document.getElementById('mapSvg');
  const container = document.getElementById('mapContainer');
  const nodes = document.querySelectorAll('.map-node');
  if (!svg || !container || !nodes.length) return;

  const cRect = container.getBoundingClientRect();
  const points = [];
  nodes.forEach(n => {
    const r = n.getBoundingClientRect();
    points.push({
      x: r.left - cRect.left + r.width/2,
      y: r.top  - cRect.top  + r.height/2
    });
  });

  const svgW = cRect.width;
  const svgH = points[points.length-1].y + 40;
  svg.setAttribute('width', svgW);
  svg.setAttribute('height', svgH);
  svg.setAttribute('viewBox', `0 0 ${svgW} ${svgH}`);

  let pathD = `M ${points[0].x} ${points[0].y}`;
  for (let i = 1; i < points.length; i++) {
    const prev = points[i-1];
    const cur  = points[i];
    const midY = (prev.y + cur.y) / 2;
    pathD += ` C ${prev.x} ${midY}, ${cur.x} ${midY}, ${cur.x} ${cur.y}`;
  }

  svg.innerHTML = `
    <path d="${pathD}" stroke="rgba(240,192,96,0.14)" stroke-width="8"
          fill="none" stroke-linecap="round"/>
    <path d="${pathD}" stroke="rgba(240,192,96,0.55)" stroke-width="2.5"
          fill="none" stroke-dasharray="6 8" stroke-linecap="round"/>
  `;
}

/* =========================================================
   19) اختيار بالسحب
   ========================================================= */
let dragging = false;
let lastTileIdx = -1;
let downX = 0, downY = 0;
const MOVE_THRESHOLD = 12;

els.wheel.addEventListener('pointerdown', e=>{
  const tile = e.target.closest('.tile');
  if(!tile || e.target.closest('.shuffle-btn')) return;
  e.preventDefault();
  const idx = parseInt(tile.dataset.idx, 10);
  if(isNaN(idx)) return;
  dragging = true; lastTileIdx = idx;
  downX = e.clientX; downY = e.clientY;
  handlePointerDown(idx);
});

document.addEventListener('pointermove', e=>{
  if(!dragging) return;
  const dx = e.clientX - downX;
  const dy = e.clientY - downY;
  if(Math.hypot(dx, dy) < MOVE_THRESHOLD) return;

  const el = document.elementFromPoint(e.clientX, e.clientY);
  const tile = el && el.closest ? el.closest('.tile') : null;
  if(!tile) return;
  const idx = parseInt(tile.dataset.idx, 10);
  if(isNaN(idx) || idx === lastTileIdx) return;
  lastTileIdx = idx;

  const pos = state.selected.indexOf(idx);
  if(pos >= 0){
    state.selected = state.selected.slice(0, pos + 1);
    beep(380, 0.03, 'sine', 0.03);
    updateTileStates(); renderSelection();
    return;
  }
  if(state.selected.length >= state.letters.length) return;
  state.selected.push(idx);
  beep(560, 0.04, 'sine', 0.04);
  updateTileStates(); renderSelection();
});

document.addEventListener('pointerup', ()=>{
  if(!dragging) return;
  dragging = false; lastTileIdx = -1;
  if(state.selected.length >= 2) checkWord();
});

document.addEventListener('pointercancel', ()=>{
  dragging = false; lastTileIdx = -1;
});

/* =========================================================
   22) نظام التحديث الذاتي — Service Worker
   =========================================================
   📌 كيف يعمل:
   1) عند أول تحميل: يسجّل sw.js ويخزّن اللعبة.
   2) عند تعديلك للعبة لاحقًا:
      - ارفع index.html الجديد
      - غيّر رقم CACHE_NAME في sw.js (مثلاً v1 → v2)
      - ارفع sw.js
   3) المستخدم يفتح اللعبة → تظهر نافذة "🔄 تحديث جديد متوفر"
   4) يضغط "تحديث الآن" → تُحدَّث اللعبة فورًا
      (دون حذف أو إعادة تثبيت من تيليجرام)
   ========================================================= */
(function initAutoUpdate() {
  if (!('serviceWorker' in navigator)) {
    console.log('⚠️ Service Worker غير مدعوم — لن يعمل التحديث التلقائي');
    return;
  }

  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js', { scope: './' })
      .then(reg => {
        console.log('✅ Service Worker مسجّل:', reg.scope);

        // التحقق من تحديثات كل 5 دقائق أثناء بقاء اللعبة مفتوحة
        setInterval(() => reg.update().catch(() => {}), 5 * 60 * 1000);

        // حدث: تم اكتشاف نسخة جديدة
        reg.addEventListener('updatefound', () => {
          const newWorker = reg.installing;
          if (!newWorker) return;

          newWorker.addEventListener('statechange', () => {
            // النسخة الجديدة مثبتة + توجد نسخة قديمة تعمل → أظهر التحديث
            if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
              showUpdateModal(newWorker);
            }
          });
        });
      })
      .catch(err => console.warn('❌ فشل تسجيل SW:', err));

    // عند تغيّر المتحكم (بعد تفعيل النسخة الجديدة) → أعد تحميل الصفحة مرة واحدة
    let refreshing = false;
    navigator.serviceWorker.addEventListener('controllerchange', () => {
      if (refreshing) return;
      refreshing = true;
      window.location.reload();
    });
  });
})();

function showUpdateModal(newWorker) {
  // تجنّب عرض النافذة مرتين
  if (document.getElementById('modalUpdate')) return;

  // احفظ الحالة الحالية قبل التحديث (اختياطي)
  save();

  showModal(`
    <div class="big">🔄</div>
    <h2>تحديث جديد متوفر</h2>
    <p>
      تمت إضافة تحسينات ومحتوى جديد للعبة.<br>
      تقدّمك محفوظ، ولن تفقد شيئًا.
    </p>
    <button class="btn-primary" id="modalUpdate">تحديث الآن</button>
    <button class="btn-ghost" id="modalLater">لاحقًا</button>
  `);

  document.getElementById('modalUpdate').onclick = () => {
    // اطلب من الـSW الجديد تفعيل نفسه فورًا
    if (newWorker && newWorker.postMessage) {
      newWorker.postMessage({ action: 'skipWaiting' });
    }
    toast('جارٍ التحديث… لحظات', 1500);

    // احتياط: إن لم يحدث controllerchange خلال ثانيتين، أعد التحميل يدويًا
    setTimeout(() => window.location.reload(), 1500);
  };

  document.getElementById('modalLater').onclick = () => {
    hideModal();
    toast('سيتم التحديث في المرة القادمة', 2200);
  };
}
</script>
